[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "refboard"
description = "A reference board for artists: arrange reference images on an endless canvas and float them over your work"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "JJ" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.11"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Viewers",
]

[project.urls]
Homepage = "https://github.com/Stigged/refboard"

# "gui-scripts": the refboard command opens no terminal window on Windows.
[project.gui-scripts]
refboard = "refboard.main:main"

[tool.setuptools]
packages = ["refboard"]

[tool.setuptools.package-data]
refboard = ["icons/*"]

[tool.setuptools.dynamic]
version = { attr = "refboard.__version__" }
